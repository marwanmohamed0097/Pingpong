<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Medicine</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <h1>Hospital Management</h1>
        <nav>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('patients') }}">Patients</a>
            <a href="{{ url_for('doctors') }}">Doctors</a>
            <a href="{{ url_for('appointments') }}">Appointments</a>
            <a href="{{ url_for('medicines.medicine_list') }}">Medicines</a>
            <a href="{{ url_for('nurses.nurse_list') }}">Nurses</a>
            <a href="{{ url_for('lab_tests.test_list') }}">Lab Tests</a>
        </nav>
    </header>

    <main class="container">
        <h2>Edit Medicine</h2>
        <section class="card form-card">
            {% if error %}<p class="error">{{ error }}</p>{% endif %}
            <form method="post">
                <label for="name">Medicine name</label>
                <input id="name" name="name" value="{{ medicine.name }}" required>

                <label for="quantity">Quantity</label>
                <input id="quantity" name="quantity" type="number" min="0" step="1" value="{{ medicine.quantity }}" required>

                <label for="price">Price per unit</label>
                <input id="price" name="price" type="number" min="0" step="0.01" value="{{ medicine.price }}" required>

                <button class="button" type="submit">Update medicine</button>
                <a class="button" href="{{ url_for('medicines.medicine_list') }}">Back to medicines</a>
            </form>
        </section>
    </main>
</body>
</html>
