<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Patient</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <h1>Hospital Management</h1>
        <nav>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('patients') }}">Patients</a>
            <a href="{{ url_for('doctors') }}">Doctors</a>
            <a href="{{ url_for('appointments') }}">Appointments</a>
            <a href="{{ url_for('medicines.medicine_list') }}">Medicines</a>
            <a href="{{ url_for('nurses.nurse_list') }}">Nurses</a>
        </nav>
    </header>

    <main class="container">
        <h2>Edit Patient</h2>
        <section class="card form-card">
            {% if error %}<p class="error">{{ error }}</p>{% endif %}
            <form method="post">
                <label for="name">Name</label>
                <input id="name" name="name" value="{{ patient.name }}" required>

                <label for="age">Age</label>
                <input id="age" name="age" type="number" min="0" value="{{ patient.age }}" required>

                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="Female" {% if patient.gender == "Female" %}selected{% endif %}>Female</option>
                    <option value="Male" {% if patient.gender == "Male" %}selected{% endif %}>Male</option>
                    <option value="Other" {% if patient.gender == "Other" %}selected{% endif %}>Other</option>
                </select>

                <label for="phone">Phone</label>
                <input id="phone" name="phone" value="{{ patient.phone }}" required>

                <label for="address">Address</label>
                <input id="address" name="address" value="{{ patient.address }}" required>

                <button class="button" type="submit">Update patient</button>
                <a class="button" href="{{ url_for('patients') }}">Back to patients</a>
            </form>
        </section>
    </main>
</body>
</html>
