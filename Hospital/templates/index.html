<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <h1>Hospital Management</h1>
        <nav>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('patients') }}">Patients</a>
            <a href="{{ url_for('doctors') }}">Doctors</a>
            <a href="{{ url_for('appointments') }}">Appointments</a>
        </nav>
    </header>
    <main class="container">
        <h2>Dashboard</h2>
        <p class="intro">Hospital information at a glance.</p>
        <section class="cards">
            <article class="card">
                <h3>Patients</h3>
                <p class="number">{{ patient_count }}</p>
                <a class="button" href="{{ url_for('patients') }}">Manage patients</a>
            </article>
            <article class="card">
                <h3>Doctors</h3>
                <p class="number">{{ doctor_count }}</p>
                <a class="button" href="{{ url_for('doctors') }}">Manage doctors</a>
            </article>
            <article class="card">
                <h3>Scheduled appointments</h3>
                <p class="number">{{ appointment_count }}</p>
                <a class="button" href="{{ url_for('appointments') }}">Manage appointments</a>
            </article>
        </section>
    </main>
</body>
</html>
