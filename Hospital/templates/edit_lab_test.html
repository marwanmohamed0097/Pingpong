<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Laboratory Test</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <h1>Hospital Management</h1>
        <nav>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('patients') }}">Patients</a>
            <a href="{{ url_for('doctors') }}">Doctors</a>
            <a href="{{ url_for('appointments') }}">Appointments</a>
            <a href="{{ url_for('lab_tests.test_list') }}">Lab Tests</a>
        </nav>
    </header>

    <main class="container">
        <h2>Edit Laboratory Test</h2>
        <section class="card form-card">
            {% if error %}<p class="error">{{ error }}</p>{% endif %}
            <form method="post">
                <label for="name">Test name</label>
                <input id="name" name="name" value="{{ test.name }}" required>

                <label for="test_type">Test type</label>
                <input id="test_type" name="test_type" value="{{ test.test_type }}" required>

                <label for="price">Price</label>
                <input id="price" name="price" type="number" min="0" step="0.01" value="{{ test.price }}" required>

                <button class="button" type="submit">Update test</button>
                <a class="button" href="{{ url_for('lab_tests.test_list') }}">Back to tests</a>
            </form>
        </section>
    </main>
</body>
</html>
