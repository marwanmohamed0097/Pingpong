<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Appointment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <h1>Hospital Management</h1>
        <nav>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('patients') }}">Patients</a>
            <a href="{{ url_for('doctors') }}">Doctors</a>
            <a href="{{ url_for('appointments') }}">Appointments</a>
            <a href="{{ url_for('medicines.medicine_list') }}">Medicines</a>
            <a href="{{ url_for('nurses.nurse_list') }}">Nurses</a>
        </nav>
    </header>

    <main class="container">
        <h2>Edit Appointment</h2>
        <section class="card form-card">
            {% if error %}<p class="error">{{ error }}</p>{% endif %}
            <form method="post">
                <label for="patient_id">Patient</label>
                <select id="patient_id" name="patient_id" required>
                    {% for patient in patients %}
                    <option value="{{ patient.id }}" {% if appointment.patient_id|int == patient.id %}selected{% endif %}>
                        {{ patient.name }}
                    </option>
                    {% endfor %}
                </select>

                <label for="doctor_id">Doctor</label>
                <select id="doctor_id" name="doctor_id" required>
                    {% for doctor in doctors %}
                    <option value="{{ doctor.id }}" {% if appointment.doctor_id|int == doctor.id %}selected{% endif %}>
                        {{ doctor.name }} — {{ doctor.specialization }}
                    </option>
                    {% endfor %}
                </select>

                <label for="appointment_date">Date</label>
                <input id="appointment_date" name="appointment_date" type="date"
                       value="{{ appointment.appointment_date }}" required>

                <label for="appointment_time">Time</label>
                <input id="appointment_time" name="appointment_time" type="time"
                       value="{{ appointment.appointment_time }}" required>

                <button class="button" type="submit">Update appointment</button>
                <a class="button" href="{{ url_for('appointments') }}">Back to appointments</a>
            </form>
        </section>
    </main>
</body>
</html>
